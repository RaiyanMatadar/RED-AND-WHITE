<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airbnb Clone</title>
  <link rel="stylesheet" href="CSS/bootstrap.min.css">
  <link rel="stylesheet" href="Remix icons/remixicon.css">
  <link rel="stylesheet" href="CSS/style.css">

  <style>
    /* ===== Navbar ===== */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
    }

    .navbar-left img {
      width: 100px;
    }

    .navbar-center ul {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .navbar-center ul li a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #222;
      font-weight: 600;
      font-size: 16px;
      position: relative;
    }

    .navbar-center ul li a.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #000;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 15px;
      font-weight: 500;
    }

    .navbar-right i {
      font-size: 20px;
      cursor: pointer;
    }

    /* ===== Search Bar ===== */
    .search-bar {
      background: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 15px;
      width: 65%;
      max-width: 900px;
      margin: 25px auto;
    }

    .search-section {
      flex: 1;
      padding: 0 20px;
      border-right: 1px solid #e0e0e0;
      cursor: pointer;
    }

    .search-section:last-child {
      border-right: none;
    }

    .search-section p {
      margin: 0;
      font-size: 12px;
      color: #555;
      font-weight: 600;
    }

    .search-section span {
      font-size: 14px;
      color: #999;
    }

    .search-btn {
      background-color: #ff385c;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .navbar-center ul {
        gap: 20px;
      }

      .search-bar {
        width: 90%;
      }

      .navbar-right {
        gap: 8px;
      }
    }
  </style>
</head>

<body>
  <header class="container">
    <nav class="navbar">
      <!-- Left -->
      <div class="navbar-left">
        <a href="#" class="logo">
          <img src="images/airbnb-Logo.png" alt="logo">
        </a>
      </div>

      <!-- Center -->
      <div class="navbar-center">
        <ul class="m-0">
          <li><a href="#" class="active"><img src="images/home.png" class="mx-2" alt="home" width="28px">Homes</a></li>
          <li><a href="#"><img src="images/experience.png" class="mx-2" alt="Experience" width="28px">Experiences</a></li>
          <li><a href="#"><img src="images/bell.png" alt="Services" class="mx-2" width="28px">Services</a></li>
        </ul>
      </div>

      <!-- Right -->
      <div class="navbar-right">
        <a href="#" class="text-dark text-decoration-none">Become a host</a>
        <i class="ri-global-line"></i>
        <i class="ri-menu-line"></i>
      </div>
    </nav>
  </header>

  <!-- ===== Search Bar ===== -->
  <section class="search-bar">
    <div class="search-section">
      <p>Where</p>
      <span>Search destinations</span>
    </div>
    <div class="search-section">
      <p>When</p>
      <span>Add dates</span>
    </div>
    <div class="search-section">
      <p>Who</p>
      <span>Add guests</span>
    </div>
    <button class="search-btn">
      <i class="ri-search-line"></i>
    </button>
  </section>

  <script src="JS/bootstrap.bundle.min.js"></script>
</body>

</html>
