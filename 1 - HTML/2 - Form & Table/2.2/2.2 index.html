<!DOCTYPE html>
<html>
	<head>	
		<title>Job Application</title>
	</head>
<body>
	<center>
		<h1>Job Application Form</h1>
		<table border="1"cellspacing="0" cellpadding="7px">
		<form>
			<tr>
				<td><label>Full Name:</label></td>
				<td><input type="text" placeholder="Enter your name"/></td>
			</tr>
			<tr>
				<td><label>Email address:</label></td>
				<td><input type="email" required /></td>
			</tr>
			<tr>
				<td><label>Phone Number:</label></td>
				<td><input type="tel" placeholder="123-456-789" maxlength="10" required /></td>
			</tr>
			<tr>
				<td>Gender:</td>
				<td>
					<input type="radio" name="gender" id="Male" required>
					<label for="Male">Male</label>
					
					<input type="radio" name="gender" id="Female" required>
					<label for="Female">Female</label>
				</td>
			</tr>
			<tr>
				<td>Job Role:</td>
				<td>
				<select required>
					<option selected disabled>--Select role--</option>
					<option>HR</option>
					<option>EMPLOYEE</option>
					<option>MANAGER</option>
					<option>PART TIME EMPLOYEE</option>
					<option>FIRED</option>
				</select>
				</td>
			</tr>
			<tr>
				<td>Date of Birth:</td>
				<td><input type="Date"></td>
			</tr>
			<tr>
				<td>Favorite Color:</td>
				<td><input type="Color"></td>
			</tr>
			<tr>
				<td>Upload resume:</td>
				<td><input type="File"></td>
			</tr>
			<tr>
				<td>Skills:</td>
				<td>
					<input type="checkbox"/>
					<label>HTML</label>

				
					<input type="checkbox"/>
					<label>CSS</label>

					
					<input type="checkbox"/>
					<label>Javascript</label>

				
					<input type="checkbox"/>
					<label>React</label>
				</td>
			</tr>
			<tr>
				<td>Cover Letter:</td>
				<td><textarea rows="5" cols="33" placeholder="Write somthing about yourself.."></textarea></td>
			</tr>
			<tr >
				<td colspan="3"align="center">
				<button>SUBMIT</button>
				<button>RESET</button>
				</td>
			</tr>
		</table>
		</form>
	</center>
</body>
</html>
