<script>
    // ===============================================
    // Lexical Scoping 
    // ===============================================

    // Lexical scoping means:    
    // A function has access to variables from the scope where it is DEFINED, 
    // not from where it is CALLED. 
    // In the example below, the inner function can access the variables 
    // of its parent function due to a concept called "lexical scoping."

    function outerL() {
        let username = "Lexical"; // outer's scope

        function inner() {
            // inner is defined inside outer
            // so it can access outer's variables
            console.log(username);
        }

        inner();
    }

    outerL(); // output: lexical

    // Scope lookup order (Scope Chain):
    // inner → outer → global

    // Key rule:
    // Defined location decides access, not call location.


    // ===============================================
    // Closure 
    // ===============================================
    function outerC() {
        let username = "closer";

        function inner() {
            console.log(username);
        }

        return inner; // returns function reference, does NOT execute it
    }

    const funcContainer = outerC();
    // outerC() executes and returns `inner`
    // `funcContainer` now holds a reference to the `inner` function

    funcContainer(); // logs "closer"

    // NOTES (Correct Understanding)
    // 1. `return inner;` returns the FUNCTION itself, not its execution
    // 2. outerC() finishes execution and is removed from the call stack
    // 3. The variable `username` is NOT deleted from memory
    // 4. `inner()` remembers `username` because it was created inside outerC()
    // 5. This remembering of outer variables is called a CLOSURE
    // 6. `funcContainer` stores a reference to `inner`, not a copy of the function

    // FINAL TRUTH (Memorize This Line)
    // A closure means: a function remembers the variables
    // of the lexical environment in which it was created




//    =====================================================
//    CLOSURES — QUICK NOTE
//    =====================================================

//    What is a closure?
//    ------------------
//    A closure happens when a function remembers variables
//    from its outer scope even after that outer function
//    has finished executing.

//    In simple words:
//    Data stays alive safely inside a function.


//    Why do we need closures?
//    -----------------------
//    Closures solve one big problem in JavaScript:
//    How to keep data private without using global variables.

//    They help to:
//    1. Avoid global variables and name conflicts.
//    2. Protect state (only specific functions can change data).
//    3. Create scalable code (multiple independent instances).
//    4. Handle async code (events, callbacks, timers).
//    5. Build real applications (React, Node, etc. rely on this).


//    What happens if we DON'T use closures?
//    --------------------------------------
//    If we rely on simple/global variables:

//    1. Data becomes unsafe – any code can change it.
//    2. Bugs become hard to track.
//    3. Code is not reusable.
//    4. Projects don’t scale well.
//    5. Architecture becomes messy and unmaintainable.


//    Bottom line:
//    ------------
//    Closures are not for making code fancy.
//    Closures are for making code safe, scalable,
//    and professional.

//    Small scripts can survive without them.
//    Real software cannot.
//    =====================================================

</script>
