<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            animation-name: spin;
            /* Assigining Animaiton to the element */
            animation-duration: 3s;
            /* telling it that how long would be the animation*/
            animation-timing-function: ease;        /* slow down at every element animation to maker it smother*/
            animation-timing-function: ease-in-out; /* consistance speed*/

            animation-delay: 1s;  /*this will delay the animation by 1s before it get start*/
            animation-iteration-count: 5; /*this will animate it by 5 time you can give infinite as well*/
            
            animation-direction: reverse; /*it will animate it backward*/
            animation-direction: alternate; /*it will animate it backward and forward both*/

             animation-fill-mode: forwards;  /*this will stop the animation to the last state once it finishes
            if you dont use it the animation will work but after it finished it will jump to its normal state */
        
            animation-play-state: running; /*this thing you can google*/

            
            /* you can combile these below in one single line but remember the order  */
            animation-duration: 3s;
            animation-name: spin;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction:alternate;

            animation: 3s spin ease-in-out 1s infinite alternate;
        }

        @keyframes spin {

            /* 0% is the Beggining of the animation */
            0% {
                transform: rotate(0);
            }

            /* 50% is for assigning animation to middle of the animation*/
            50% {
                scale: 2;
            }

            /* 100% is the Ending of the animation */
            100% {
                transform: rotate(360deg);
                border-radius: 50%;
                scale: 2;
                /* i have added 2 time scale one is for 50% and other one for 100%
                its because the animation would apply from the 50% then if you want your 
                animation to be remain then you must also apply the state of property that you apply 
                from the middle in my case the remaining property is scale:2;  */

            }
        }
    </style>
</head>

<body style="display: flex; justify-content: center; align-items: center;">
    <div class="container" style="height: 500px; display: flex; justify-content: center; align-items: center;">
        <div class="box"
            style="background-color: blue; height: 200px; width: 200px; display: flex; justify-content: center; align-items: center">
            Raiyan Matadar</div>
    </div>
</body>

</html>
