<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM (Document Object Model)</title>
    <style>
        body {
            text-align: center;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .bg-black {
            color: gold;
            background-color: black;
        }
        
        .heading {
            color: white;
        }
    </style>
</head>

<body>

    <div class="bg-black">
        <h1 class="heading">DOM Learning</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ut, aut!</p>
    </div>

    <script>
        // What is DOM (Document Object Model)?

        // DOM (Document Object Model) is the browsers live, in-memory, object-based representation of your HTML page.

        // -"Document"→
        // your HTML file(the webpage structure) -
        //     "Object"→
        // the browser converts every HTML element(html, head, body, div, h1, etc.) into JavaScript objects -
        //     "Model"→
        // these objects are arranged in a tree structure(DOM Tree)

        // Using the DOM, JavaScript can:
        //     -add new elements -
        //     modify existing elements -
        //     remove elements -
        //     change styles and attributes -
        //     handle events(e.g., button clicks, input changes)

        // Important:
        // DOM is NOT the original HTML file. ( when we make website the html whole get converted into DOM )
        // It is the browser’ s editable version of the page that JavaScript can control. 

        // ---------------------------------------------------------------------------------

        // Basics of DOM 

        // console.log(document);
        // console.log(document.head);
        // console.dir(document.head); //as you can see the object using dir 
        // document.head does not give the raw <head> tag from the HTML file.
        // The browser converts every HTML tag into an object in the DOM.
        // That’s why we can manipulate it using JavaScript.
        // JS cannot directly edit the original HTML file — it can only work on the
        // DOM objects that the browser creates.

        // ------------------------------------------------------------------------------

        // console.log(document.all);
        // document.all looks like an array, but it is NOT a real array.
        // Because of that, array methods like forEach() do not work on it.

        // document.all is an HTMLAllCollection, not an Array.
        // To confirm this, check its [[Prototype]] in the console:
        // It shows HTMLAllCollection and inside it you will find Symbol.iterator.

        // Symbol.iterator means the object is iterable.
        // So even though it's not an array, you CAN loop through it using
        // traditional loops like for, for...of, or while.

        // Summary:
        // document.all = iterable, but not an array → no array methods, loops only.

        // ------------------------------------------------------------------------------

        // console.dir(document.all[4]);
        // Never select elements using document.all[index].
        // This is unreliable because the index depends on the exact structure
        // of the HTML document.

        // If the HTML changes in the future (elements added, removed, moved),
        // the index will point to a completely different element.
        // This can break your code or cause unexpected behavior.

        // Instead, always select elements using proper DOM methods like:
        // document.getElementById(), document.querySelector(), etc.

        // We will learn better element-selection methods in the DOM Traversal lesson.
    </script>
</body>

</html>
