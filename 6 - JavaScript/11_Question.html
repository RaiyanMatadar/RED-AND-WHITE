<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>createElement</title>
</head>

<body>
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
    </div>

    <script>
        const boxVariable = document.createElement("div");
        boxVariable.innerText = "Hello";
        boxVariable.style.color = "red";
    </script>
</body>

</html>
