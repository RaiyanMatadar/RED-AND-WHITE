<!DOCTYPE html>
<html>
    <head>
        <title>Multi Level UI effect Showcase</title>
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>
    <body>
        <!-- NAVBAR SECTION   -->
        <header>
            <nav>
                <div class="nav-head">
                <h1>Multi Level UI effect Showcase</h1>
                <p>All section are styled without flexbox</p>
                </div>
            </nav>
        </header>
        <main>

            <!-- LAYERED PROFILE CARDS SECTION  -->
            
            <h2>Layered Profile Cards</h2>
            <div class="container">
                <div class="Profile1">
                    <img src="images/man.jpg" alt="Man" width="100px" height="100px"><br/>
                    <strong>Bob</strong>
                    <p>Frontend developer</p>
                </div>

                <div class="Profile2">
                    <img src="images/lady.jpg" alt="Man" width="100px" height="100px"><br/>
                    <strong>Alice</strong>
                    <p>Full stack developer</p>
                </div>
            </div>
        
            <!-- QUICK FLASH CARD SECTION -->
            <h6>Quick Flashcard</h6>
            <div class="pos">
            <div class="container2">
                <div class="inner">
                    <div class="element1">What is HTML?</div>
                    <div class="element2">HyperText markup language</div>
                </div>
            </div>

            <div class="container2">
                <div class="inner">
                    <div class="element2">What is CSS?</div>
                    <div class="element3">cascading style sheet</div>
                </div>
            </div>
            </div>
            
             <!-- CREATIVE BUTTON -->
             <h3>Creative Button</h3>
             <div class="container3">
                <button class="Button1"><p>Side Button</p></button>
                <button class="Button2">Glow Button</button>
             </div>

             <!-- Interactive Image Gallary -->
            <h4>Interactive Image Gallary</h4>
            <div class="container4">
                <div class="Image"><img src="images/nature.jpg" alt="Nature" width="400px"></div>
                <div class="Image"><img src="images/nature2.jpeg" alt="Nature" width="400px"></div>
                <div class="Image"><img src="images/nature3.jpg" alt="Nature" width="400px"></div>
             </div>
        </main>
    </body>
</html>
