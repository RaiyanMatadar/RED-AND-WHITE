<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Responsive Card Grid Layout</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css" />
    <!-- Media Query CSS -->
    <link rel="stylesheet" href="media query.css" />
</head>

<body>
    <header>
        <div class="container">
            <div class="top-section">
                <div class="top-items display-flex justify-content-center align-items-center">
                    <p>How many contanct do you have?</p>
                    <select>
                        <option>500</option>
                        <option>900</option>
                        <option>200</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section>
            <div class="container">
                <div class="row-flex">
                    <div class="width-content-4">
                        <div class="cards">
                            <div class="cards-items">
                                <div class="card-title">
                                    <h3>Premium</h3>
                                    <p>Lorem ipsum dolor sit amet consectetur. Lorem, ipsum dolor.</p>
                                </div>
                            </div>
                            <div class="cards-prices">
                                <p>Start at</p>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </section>
    </main>
</body>

</html>
