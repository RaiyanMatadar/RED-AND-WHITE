<!DOCTYPE html>
<html>

<head>
    <title>Hotstar Project</title>
    <!-- ICONS -->
    <script src="https://kit.fontawesome.com/eda8355c00.js" crossorigin="anonymous"></script>
    <!-- MAIN CSS -->
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <header>
        <nav>
            <!-- Left-Section of navbar -->
            <div class="left-section">
                <ul>
                    <li>Prime Videos</li>
                    <li>Home</li>
                    <li>Movies</li>
                    <li>TV shows</li>
                    <li>Live TV</li>
                    <li>
                    <li>
                        <i class="fa-solid fa-user-plus"></i> &nbsp; subscription
                    </li>
                </ul>
            </div>

            <div class="right-section">
                <ul>
                    <li><i class="fa-solid fa-magnifying-glass"></i></li>
                    <li>
                        <select>
                            <option>ENG</option>
                            <option>SPANICE</option>
                            <option>PORTUGESE</option>
                            <option>CHINESE</option>
                        </select>
                    </li>
                    <li><i class="fa-solid fa-bars"></i></li>
                    <li><i class="fa-solid fa-circle-user"></i></li>
                    <li><button>Join Prime</button></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div>
            <h1>Welcome to prime videos</h1>
            <p>Join Prime to watch the latest movies, TV shows and award-winning Amazon Originals</p>
            <div class="button"><button>Sign in to join</button></div>
        </div>
    </main>
</body>

</html>
