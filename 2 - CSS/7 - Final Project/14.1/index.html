<!DOCTYPE html>
<html>

<head>
    <title>Netflix Home Page</title>
    <!-- Fonts  -->
    <link rel="stylesheet" href="fonts/Mulish/stylesheet.css">
    <!-- Awsomefont icons -->
    <script src="https://kit.fontawesome.com/eda8355c00.js" crossorigin="anonymous"></script>
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <!-- Header section -->
        <div class="container">
            <div class="navbar row-wrap justify-between align-items-center">
                <div class="logo">
                    <img src="Images/logo.png" alt="Logo" width="200px">
                </div>
                <div class="buttons row-wrap">
                    <div class="nav-dropdown">
                        <select>
                            <option><i class="fa-solid fa-language"></i>English</option>
                            <option><i class="fa-solid fa-language"></i>Spanish</option>
                            <option><i class="fa-solid fa-language"></i>Portugese</option>
                        </select>
                    </div>
                    <div class="sign-in">
                        <button>Sign in</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- top title section -->
    <main>
        <section id="top-section-background">
            <div class="container">
                <div class="top-section display-flex-column">
                    <div class="top-title">
                        <h1>Unlimited movies, <br />TV shows and more</h1>
                        <h2>Starts at $10 cancel at any time.</h2>
                        <p>Ready to watch? Enter email to create or restart your membership.</p>
                    </div>
                    <div class="top-search">
                        <form>
                            <input type="email" placeholder="Email address" id="top-search">
                            <button for="top-search">Get started ></button>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tranding Movies section -->
        <div id="main-background">
            <section>
                <div class="container">
                    <div class="tranding-movies">
                        <h3>Tranding Now</h3>
                        <div class="width-content-5">
                            <div class="movies-img"><img src="/Images/P1.jpg" alt="Movie1"></div>
                            <div class="movie-character">1</div>
                        </div>
                    </div>
                </div>
        </div>
        </section>
        </div>
    </main>
</body>

</html>
