<!DOCTYPE html>
<html lang="en">

<head>
    <title>Team Member Layout Using Box Model</title>
    <!-- FONT AWSOME -->
     <script src="https://kit.fontawesome.com/eda8355c00.js" crossorigin="anonymous"></script>
     <!-- MAIN CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- FIRST IMAGE -->
    <div class="first">
        <img src="Images/man.png" alt="1st Member" width="300">
    </div>

    <!-- SECOND IMAGE -->
    <div class="container">
        <div class="parent">
            <h1>Meet Our Team</h1>
            <div>
                <img src="Images/man.png" alt="1st Member" width="300" height="300">
                <div><strong>Michel Brown</strong></div>
                <p>&lt;/&gt; Frontend Developer</p>
            </div>
        </div>
    </div>
    <br />
    <!-- THIRD IMAGE -->
    <div class="container2">
        <div class="text">
            <h1>Raiyan M</h1>
            <p>Full stack developer</p>
        </div>
        <div class="elements">
            <img src="Images/man.png" alt="man" width="200px">
        </div>
    </div>
    <div class="icons">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-linkedin"></i>
        </div>

</body>

</html>
